<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Особняк Блэквудов</title>
  <desc id="desc">Парадный зал мрачного особняка с двойной лестницей, старинными портретами, мраморным полом и холодной люстрой.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#101f2a"/><stop offset="1" stop-color="#343c3d"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#4b5653"/><stop offset="1" stop-color="#101d23"/></linearGradient>
    <linearGradient id="stairs" x2="0" y2="1"><stop stop-color="#8a9085"/><stop offset="1" stop-color="#333b40"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#cde3da" stop-opacity=".4"/><stop offset="1" stop-color="#a9bfc7" stop-opacity="0"/></radialGradient>
    <pattern id="wallpaper" width="74" height="68" patternUnits="userSpaceOnUse"><path d="M37 8q-36 26 0 52q36-26 0-52zm0 10v33" fill="none" stroke="#b0a58b" stroke-opacity=".085" stroke-width="2"/></pattern>
    <pattern id="tiles" width="98" height="98" patternUnits="userSpaceOnUse"><path d="M0 0h98v98H0zM0 0l98 98M98 0L0 98" fill="none" stroke="#b7c2b7" stroke-opacity=".11" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="440" fill="url(#wall)"/>
