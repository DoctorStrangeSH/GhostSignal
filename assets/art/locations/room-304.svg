<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Номер 304 отеля Гранд</title>
  <desc id="desc">Тревожный гостиничный номер: смятая постель, закрытое окно, тяжёлый шкаф, треснувшее зеркало, дверь с цепочкой и тёмный ковёр.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#12242d"/><stop offset="1" stop-color="#364146"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#222d30"/><stop offset="1" stop-color="#101a20"/></linearGradient>
    <linearGradient id="bed" x2=".2" y2="1"><stop stop-color="#b5afa1"/><stop offset="1" stop-color="#696c6c"/></linearGradient>
    <linearGradient id="wood" x2="1" y2=".2"><stop stop-color="#201b1e"/><stop offset=".55" stop-color="#4c3230"/><stop offset="1" stop-color="#1a191c"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#a5d5d8" stop-opacity=".44"/><stop offset="1" stop-color="#5c929c" stop-opacity="0"/></radialGradient>
    <pattern id="wallpaper" width="70" height="52" patternUnits="userSpaceOnUse"><path d="M35 8Q8 26 35 44Q62 26 35 8ZM35 15v23" fill="none" stroke="#b9ab8c" stroke-opacity=".095" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="440" fill="url(#wall)"/>
  <rect width="1200" height="288" fill="url(#wallpaper)"/>
  <path d="M0 282h1200" stroke="#95866c" stroke-width="8" opacity=".64"/>
  <path d="M0 291h1200v149H0z" fill="url(#floor)"/>
  <path d="M0 0h1200v17H0z" fill="#101a20"/>
  <path d="M0 17h1200" stroke="#a28d68" stroke-opacity=".48" stroke-width="4"/>
  <!-- The window gives environmental context but no discovered clue. -->
  <path d="M374 45h335v246H374z" fill="#111d25" stroke="#928a78" stroke-width="13"/>
  <path d="M394 62h295v207H394z" fill="#193640"/>
  <path d="M394 62h295v207H394z" fill="url(#moon)"/>
  <path d="M410 238l60-65 42 32 69-90 62 59 46-42v137H410z" fill="#10252c"/>
  <path d="M410 267h279" stroke="#758f8e" stroke-opacity=".28" stroke-width="4"/>
  <path d="M541 62v207M394 165h295" stroke="#8c8a7d" stroke-width="13"/>
  <path d="M541 62v207M394 165h295" stroke="#1b3037" stroke-width="7"/>
