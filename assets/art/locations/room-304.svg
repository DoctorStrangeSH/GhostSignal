  <path d="M29 329h243v16H29z" fill="#251d1c"/>
  <!-- The crooked mirror is opaque: nothing hidden behind it is shown. -->
  <g transform="rotate(-3 880 158)"><path d="M804 57h164v206H804z" fill="#42312c" stroke="#bb9a6b" stroke-width="9"/><path d="M822 77h128v166H822z" fill="#344e52" stroke="#c0b9a4" stroke-opacity=".55" stroke-width="4"/><path d="M830 209l66-79-13 45 60-88" fill="none" stroke="#9ac3bc" stroke-opacity=".37" stroke-width="3"/><path d="M889 82l-20 50 31 34-36 54" fill="none" stroke="#c7d4ce" stroke-opacity=".6" stroke-width="2"/></g>
  <!-- Door chain visible only as hardware; its examined mechanism remains in gameplay. -->
