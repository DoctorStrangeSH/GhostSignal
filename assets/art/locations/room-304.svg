  <path d="M368 285h350" stroke="#bdad8d" stroke-width="8"/>
  <!-- A closed, unexamined wardrobe. -->
  <path d="M37 72h222v257H37z" fill="url(#wood)" stroke="#8e6d54" stroke-width="8"/>
  <path d="M51 86h193v227H51z" fill="none" stroke="#b0926e" stroke-opacity=".44" stroke-width="3"/>
