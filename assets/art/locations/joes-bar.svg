<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Бар У Джо</title>
  <desc id="desc">Полутёмный джазовый бар с длинной стойкой красного дерева, бутылками, музыкальным автоматом, столиками и янтарными лампами.</desc>
