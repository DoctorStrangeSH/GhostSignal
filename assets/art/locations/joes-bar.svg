    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#3a2927"/><stop offset="1" stop-color="#0e151a"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#ffcb79" stop-opacity=".55"/><stop offset="1" stop-color="#ed9b4a" stop-opacity="0"/></radialGradient>
    <pattern id="panel" width="105" height="100" patternUnits="userSpaceOnUse"><path d="M7 0v100M98 0v100M7 91h91" fill="none" stroke="#ad7d57" stroke-opacity=".22" stroke-width="3"/></pattern>
  </defs>
