name: Visual smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Start static web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ghost-visual-server.log 2>&1 &
          echo $! > /tmp/ghost-visual-server.pid
      - name: Capture interactive screens
        run: node scripts/visual-smoke.mjs
      - name: Audit responsive layouts
        run: node scripts/responsive-smoke.mjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-signal-visual-smoke
          path: artifacts/visual-smoke/*.png
          if-no-files-found: warn
          retention-days: 7
