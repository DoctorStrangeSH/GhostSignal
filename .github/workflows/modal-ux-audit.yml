name: Modal UX audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modal-ux:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Start static web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ghost-modal-server.log 2>&1 &
          echo $! > /tmp/ghost-modal-server.pid
      - name: Audit long dialogs and close behavior
        run: node scripts/modal-ux-audit.mjs
      - name: Audit keyboard focus containment and restoration
        run: node scripts/modal-keyboard-audit.mjs
